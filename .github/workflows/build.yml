name: Build
on:
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'
      - 'screenshots/**'
      - 'internal_docs/**'
      - 'LICENSE'
  pull_request:
permissions:
  contents: write

jobs:
  ANDROID_BUILD_APK:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: 'gradle'

      # Install the pinned debug key BEFORE the first Gradle invocation. Gradle/AGP may
      # resolve or create the default debug signing config during configuration, so doing
      # this after detekt can leave the daemon holding a runner-generated key and make
      # successive CI APKs impossible to update over each other.
      - name: Setup custom keystore file
        run: |
          mkdir -p $HOME/.android
          cp ./.ci/debug.keystore $HOME/.android/debug.keystore

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Execute APK build
        # Only the github flavor for CI; fdroid builds are driven by F-Droid's own
        # build server from the fdroiddata metadata.
        run: ./gradlew app:assembleGithubDebug -PfrigateViewerBuildRoot=${{ github.workspace }}/build-output --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: apk-files
          path: build-output/app/outputs/apk/**/*.apk

      - name: Upload dev APK to dev-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          gh release create dev-latest --target dev --title "Dev Build (latest)" --notes "Automatically updated debug APK from the latest dev push." --prerelease 2>/dev/null || true
          gh release upload dev-latest build-output/app/outputs/apk/github/debug/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
